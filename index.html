<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body data-title-key="home.meta.title" data-desc-key="home.meta.description">
    <div class="noise-overlay"></div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">

                </div>
                <h1 class="headline fade-in stagger-2" data-i18n-html="home.hero.headline"></h1>
                <p class="hero-subtitle fade-in stagger-3" data-i18n="home.hero.subtitle"></p>
            </div>
        </section>

        <div class="container">

            <div class="case-card glass-panel fade-in slide-left">

                    <p data-i18n="home.nexus.text"></p>
                    <a href="project-nexus.html" class="btn-primary" data-i18n="cta.caseStudy"></a>
                </div>
                <div class="case-image">
                    <img src="assets/images/home/nexus-cover.png" data-i18n-attr="alt:home.nexus.imgAlt" alt="Dashboard del postulante en Nexus">
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer fade-in zoom">
            <div class="footer-content glass-panel">
                <p data-i18n="footer.rights"></p>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/dazanella/" target="_blank" rel="noopener" class="social-link">LinkedIn</a>
                    <a href="mailto:dzanella2898@gmail.com" class="social-link" data-i18n="footer.email"></a>

            </div>
